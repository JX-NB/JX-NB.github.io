<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>江寻 · 云辞</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #05060a;
    overflow: hidden;
    font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8eef7;
    -webkit-text-size-adjust: 100%;
  }

  #snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, rgba(90, 130, 190, 0.16), transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 100%, rgba(120, 150, 210, 0.10), transparent 70%);
  }

  .stage {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px;
  }

  .avatar-wrap {
    position: relative;
    width: min(220px, 56vw);
    height: min(220px, 56vw);
  }
  .avatar-wrap::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(160, 200, 255, 0.55), rgba(120, 150, 220, 0.15), rgba(160, 200, 255, 0.55));
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #05060a;
    box-shadow: 0 0 40px rgba(120, 160, 230, 0.35);
  }

  .name {
    font-size: clamp(30px, 7vw, 42px);
    font-weight: 700;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    text-shadow: 0 0 18px rgba(150, 190, 255, 0.45);
  }

  .subtitle {
    font-size: clamp(14px, 3.4vw, 17px);
    font-weight: 300;
    letter-spacing: 0.18em;
    color: #aab8cf;
  }

  .timer {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(8px, 2.5vw, 16px);
    margin-top: 6px;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: clamp(52px, 14vw, 72px);
  }
  .unit .num {
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: #eef4ff;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(150, 185, 240, 0.18);
    border-radius: 12px;
    padding: 10px 6px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(6px);
    text-shadow: 0 0 14px rgba(140, 180, 255, 0.4);
  }
  .unit .label {
    font-size: clamp(11px, 2.8vw, 13px);
    color: #8fa0bb;
    letter-spacing: 0.1em;
  }
  .colon {
    font-size: clamp(22px, 6vw, 32px);
    color: #6d82a6;
    padding-top: 8px;
  }

  .tag {
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: #67769a;
  }

  @media (min-width: 601px) and (max-width: 1024px) {
    .stage { gap: 24px; }
    .avatar-wrap { width: min(200px, 40vw); height: min(200px, 40vw); }
    .name { font-size: 34px; }
    .subtitle { font-size: 16px; }
    .unit { min-width: 64px; }
    .unit .num { font-size: 26px; padding: 10px 8px; }
    .colon { font-size: 26px; }
  }

  @media (max-width: 600px) {
    .stage { gap: 18px; padding: 18px; }
    .avatar-wrap { width: min(150px, 48vw); height: min(150px, 48vw); }
    .avatar-wrap::before { inset: -4px; }
    .avatar { border-width: 3px; }
    .name { font-size: 26px; letter-spacing: 0.3em; }
    .subtitle { font-size: 13px; letter-spacing: 0.12em; }
    .timer { gap: 6px; row-gap: 12px; }
    .unit { min-width: 44px; gap: 6px; }
    .unit .num { font-size: 18px; padding: 8px 4px; border-radius: 10px; }
    .unit .label { font-size: 11px; }
    .colon { font-size: 18px; padding-top: 6px; }
    .tag { font-size: 11px; }
  }

  @media (max-width: 360px) {
    .avatar-wrap { width: 128px; height: 128px; }
    .unit { min-width: 38px; }
    .unit .num { font-size: 16px; }
    .timer { gap: 4px; }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <canvas id="snow"></canvas>

  <main class="stage">
    <div class="avatar-wrap">
      <img class="avatar" src="https://raw.githubusercontent.com/JX-NB/picture/main/jiang-xun.PNG" alt="江寻头像">
    </div>

    <div class="name">江寻</div>
    <div class="subtitle">已加入罗布乐思脚本圈</div>

    <div class="timer" id="timer">
      <div class="unit"><div class="num" id="y">0</div><div class="label">年</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="mo">0</div><div class="label">月</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="d">0</div><div class="label">天</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="h">00</div><div class="label">时</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="mi">00</div><div class="label">分</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="s">00</div><div class="label">秒</div></div>
    </div>

    <div class="tag">云辞脚本</div>
  </main>

<script>
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');
  let W, H, flakes = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    const count = Math.min(240, Math.floor(W * H / 6000));
    flakes = Array.from({ length: count }, () => spawn(true));
  }

  function spawn(randomY) {
    return {
      x: Math.random() * W,
      y: randomY ? Math.random() * H : -10,
      r: Math.random() * 2.8 + 1,
      speed: Math.random() * 1.4 + 0.5,
      drift: Math.random() * 1 - 0.5,
      swing: Math.random() * Math.PI * 2,
      swingSpeed: Math.random() * 0.025 + 0.006,
      opacity: Math.random() * 0.6 + 0.35
    };
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const f of flakes) {
      f.swing += f.swingSpeed;
      f.y += f.speed;
      f.x += f.drift + Math.sin(f.swing) * 0.6;

      if (f.y > H + 10) Object.assign(f, spawn(false));
      if (f.x < -10) f.x = W + 10;
      if (f.x > W + 10) f.x = -10;

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(225, 238, 255, ${f.opacity})`;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();
  tick();

  const start = new Date("2026-11-20 16:09:18").getTime();
  const el = {
    y: document.getElementById('y'),
    mo: document.getElementById('mo'),
    d: document.getElementById('d'),
    h: document.getElementById('h'),
    mi: document.getElementById('mi'),
    s: document.getElementById('s')
  };

  const YEAR = 365.25 * 24 * 3600 * 1000;
  const MONTH = 30.44 * 24 * 3600 * 1000;
  const DAY = 24 * 3600 * 1000;

  function pad(n) { return String(n).padStart(2, '0'); }

  function update() {
    let diff = Date.now() - start;
    if (diff < 0) diff = 0;

    const y = Math.floor(diff / YEAR);
    diff -= y * YEAR;
    const mo = Math.floor(diff / MONTH);
    diff -= mo * MONTH;
    const d = Math.floor(diff / DAY);
    diff -= d * DAY;
    const h = Math.floor(diff / 3600000);
    diff -= h * 3600000;
    const mi = Math.floor(diff / 60000);
    const s = Math.floor((diff - mi * 60000) / 1000);

    el.y.textContent = y;
    el.mo.textContent = mo;
    el.d.textContent = d;
    el.h.textContent = pad(h);
    el.mi.textContent = pad(mi);
    el.s.textContent = pad(s);
  }

  update();
  setInterval(update, 250);
</script>
</body>
</html>
